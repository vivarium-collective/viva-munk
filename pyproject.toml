[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "viva-munk"
version = "0.1.0"
description = "viva-munk — multi-cell simulations with pymunk 2D physics: process-bigraph processes, composites, and visualizations (the simulator). Studies/investigations live in viva-munk-studies, which pins this package per study."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
  {name = "Eran Agmon", email = "agmon.eran@gmail.com"},
  {name = "Ryan Spangler"},
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "process-bigraph>=1.8.5",  # composite_generator core_extensions (used by our generators) landed in 1.8.0
    "bigraph-schema>=0.0.60",
    "bigraph-viz",
    "pymunk",
    "numpy",
    "matplotlib",
    "Pillow",
    "plum-dispatch",
    # viva_munk/__init__.py imports SQLiteEmitter from process_bigraph.emitter at
    # module load; SQLiteEmitter was extracted to the focused `viva-emitters`
    # package and is only lazily re-exported there, so a standalone
    # `pip install viva-munk` fails with `No module named 'viva_emitters'` unless
    # viva-emitters is declared (it was previously satisfied transitively only
    # when the workbench happened to be installed alongside).
    "viva-emitters>=0.4.2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ipdb",
    "build",
    "twine>=4.0.2",
]

[project.urls]
Homepage = "https://github.com/vivarium-collective/viva-munk"
Repository = "https://github.com/vivarium-collective/viva-munk"

# `packages = ["viva_munk"]` ships the ENTIRE viva_munk/ tree — every subpackage,
# including composites/ and visualizations/ (the package's __init__ imports them).
# No force-include: the workspace content (workspace.yaml, studies/,
# investigations/) now lives in the viva-munk-studies repo, not here. This repo is
# the SIMULATOR; downstream consumers that `import viva_munk` are unaffected.
[tool.hatch.build.targets.wheel]
packages = ["viva_munk"]

# NOTE: this package previously declared a [tool.uv.sources] override
# pointing process-bigraph at `../process-bigraph` (editable). That
# section is dev-only convenience for working in a sibling checkout
# layout — but it leaks into downstream consumers when viva-munk is
# pulled as a git dependency, because uv resolves the transitive
# source path as `subdirectory=../process-bigraph` of the git URL,
# which doesn't exist. Removed for now; if you need the local
# editable checkout, install it explicitly:
#
#   pip install -e ../process-bigraph
#
# or add the override in YOUR project's pyproject.toml (not here).
